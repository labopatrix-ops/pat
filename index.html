<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Biography Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;padding:20px;overflow:hidden}
.bg-left,.bg-right{position:absolute;top:0;width:50%;height:100%;background-size:cover;background-position:center}
.bg-left{left:0;background-image:url("image/back.jpg")}
.bg-right{right:0;background-image:url("image/carlpat.jpg")}
.overlay{position:absolute;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:1}
.card{position:relative;z-index:2;background:rgba(0,0,0,.4);padding:30px;border-radius:12px;text-align:center;color:#fff;max-width:500px;width:100%;border:1px solid rgba(0,150,255,.3)}
.logo{width:180px;height:180px;border-radius:8px;object-fit:contain;border:3px solid #0096ff;background:#fff;padding:10px;margin:15px 0}
h1{font-size:28px;margin-bottom:15px}
h2{font-size:22px;margin:10px 0}
.bio{color:#ddd;margin:15px 0}
.contact{display:flex;justify-content:space-around;flex-wrap:wrap;gap:15px;margin-top:10px}
.contact a{color:#0096ff;text-decoration:none}
</style>
</head>
<body>
<div class="bg-left"></div>
<div class="bg-right"></div>
<div class="overlay"></div>
<div class="card">
  <h1>Biography Website</h1>
  <img src="image/1233.jpg" alt="Logo" class="logo">
  <h2>Patrick Labo</h2>
  <p class="bio">Hi I am Patrick and I like Computers<br>Real Real</p>
  <div class="contact">
    <div><strong>Phone</strong><br>+123 456 7890</div>
    <div><strong>Email</strong><br><a href="mailto:labopatrix@gmail.com">labopatrix@gmail.com</a></div>
    <div><strong>Website</strong><br><a href="#">www.example.com</a></div>
  </div>
</div>
</body>
</html>
